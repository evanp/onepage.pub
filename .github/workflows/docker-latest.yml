name: Push app to GHCR

on:
  workflow_dispatch:

  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:

  runTests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:

    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test

  docker:
    needs: runTests
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/evanp/onepage.pub
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/evanp/onepage.pub:latest
          cache-to: type=inline

      - name: Smoke test
        run: |
          container_id=$(docker run --detach --publish 65380:65380 --env OPP_ORIGIN=https://test.example/ --env OPP_HOSTNAME=localhost --env OPP_PORT=65380 "$IMAGE:${{ github.sha }}")
          trap 'docker rm --force "$container_id"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:65380/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

      - name: Push
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:${{ github.sha }}"
