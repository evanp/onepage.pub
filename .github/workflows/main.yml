name: Test app

on:
  workflow_dispatch:

  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:

  runTests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:

    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test
