name: Push tags to GHCR stable

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read
  packages: write

jobs:
    runTests:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            node-version: [22, 24, 26]
        steps:

        - uses: actions/checkout@v7

        - uses: actions/setup-node@v7
          with:
            node-version: ${{ matrix.node-version }}

        - name: Install dependencies
          run: npm ci

        - name: Run tests
          run: npm run test

    pushToGHCR:
        needs: runTests
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        env:
          SHA: ${{ github.sha }}
          IMAGE: ghcr.io/evanp/onepage.pub
        steps:

        - uses: actions/checkout@v7

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Log in to the Container registry
          uses: docker/login-action@0a596b2e7a325f0cedf8e9bd21ab002cbd3c9241
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build
          run: docker buildx build --platform linux/amd64,linux/arm64 --push --tag "$IMAGE:$SHA" .

        - name: Smoke test
          run: |
            container_id=$(docker run --detach --publish 65380:65380 --env OPP_ORIGIN=https://test.example/ --env OPP_HOSTNAME=localhost --env OPP_PORT=65380 "$IMAGE:$SHA")
            trap 'docker rm --force "$container_id"' EXIT
            for attempt in {1..30}; do
              if curl --fail --silent --show-error http://localhost:65380/ready; then
                exit 0
              fi
              sleep 1
            done
            docker logs "$container_id"
            exit 1

        - name: Push
          run: |
            VERSION=$(node -pe "require('./package.json').version")
            MAJOR=${VERSION%.*.*}
            MINOR=${VERSION%.*}
            echo Version: ${VERSION} Major: ${MAJOR} Minor: ${MINOR}
            docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:$MAJOR" --tag "$IMAGE:$MINOR" --tag "$IMAGE:stable" "$IMAGE:$SHA"
